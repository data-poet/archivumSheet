<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archivum Sheet — Referência</title>
    <!-- Applies the resolved theme before first paint, to avoid a flash of
         the wrong theme. Mirrored in components/theme.js, which keeps it in sync
         afterward (button state, live OS-preference changes). -->
    <script>
      (function () {
        var stored = localStorage.getItem("archivum:theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="icon"
      type="image/png"
      href="/images/chrome-touch-icon-192x192.png"
    />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta
      name="msapplication-TileImage"
      content="/images/ms-touch-icon-144x144-precomposed.png"
    />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <!-- Markdown renderer and its callout extension for the reference content (see reference/markdown.js).
         Pinned: an unpinned marked major could break marked-alert or the glossary extension. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-alert@2.1.2/dist/index.umd.js"></script>
    <!-- Math renderer (KaTeX) for formulas inside reference markdown (see reference/content.js) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    ></script>
  </head>

  <body class="has-groupnav">
    <!-- ═══════════════════════════════════════════════════════════════════════
         MOBILE: Top bar
         ═══════════════════════════════════════════════════════════════════════ -->
    <header class="l-topbar" id="topbar">
      <div class="topbar-logo">
        <img src="/images/chrome-touch-icon-128x128.png" alt="Archivum Sheet" />
        <span class="topbar-logo-name" id="topbar-title"
          >Archivum — Referência</span
        >
      </div>
      <div class="topbar-actions">
        <button
          id="theme-toggle-btn"
          class="topbar-btn topbar-btn-icon-only"
          type="button"
          aria-label="Mudar para modo escuro"
          aria-pressed="false"
        >
          ☀️
        </button>
        <button
          id="page-selector-btn"
          class="topbar-btn page-selector-btn"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="Trocar de página"
        ></button>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════════════
         DESKTOP: Sidebar nav (built by components/nav.js)
         ═══════════════════════════════════════════════════════════════════════ -->
    <nav class="l-sidebar" id="sidebar" aria-label="Navegação"></nav>

    <!-- Group bar (built by components/groupNav.js) -->
    <nav class="l-groupnav" id="groupnav"></nav>

    <!-- ═══════════════════════════════════════════════════════════════════════
         MAIN CONTENT — sections/tabs built by reference/content.js
         ═══════════════════════════════════════════════════════════════════════ -->
    <main class="l-main" id="reference-main"></main>

    <!-- Page selector popover (built by components/pageSelector.js) -->
    <div
      id="page-selector-popover"
      class="char-selector-popover page-selector-popover"
      role="group"
      aria-label="Selecionar página"
    ></div>

    <script type="module" src="/js/reference/main.js"></script>
  </body>
</html>
