<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archivum Sheet — Aliados</title>
    <!-- Applies the resolved theme before first paint, to avoid a flash of
         the wrong theme. Mirrored in components/theme.js, which keeps it in sync
         afterward (button state, live OS-preference changes). -->
    <script>
      (function () {
        var stored = localStorage.getItem("archivum:theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="icon"
      type="image/png"
      href="/images/chrome-touch-icon-192x192.png"
    />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta
      name="msapplication-TileImage"
      content="/images/ms-touch-icon-144x144-precomposed.png"
    />
    <meta name="msapplication-TileColor" content="#ffffff" />
  </head>

  <body>
    <!-- ═══════════════════════════════════════════════════════════════════════
         MOBILE: Top bar
         ═══════════════════════════════════════════════════════════════════════ -->
    <header class="l-topbar" id="topbar">
      <div class="topbar-logo">
        <img src="/images/chrome-touch-icon-128x128.png" alt="Archivum Sheet" />
        <span class="topbar-logo-name" id="topbar-title"
          >Archivum — Aliados</span
        >
      </div>
      <div class="topbar-actions">
        <button
          id="theme-toggle-btn"
          class="topbar-btn topbar-btn-icon-only"
          type="button"
          aria-label="Mudar para modo escuro"
          aria-pressed="false"
        >
          ☀️
        </button>
        <button
          id="page-selector-btn"
          class="topbar-btn page-selector-btn"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="Trocar de página"
        ></button>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════════════
         MAIN CONTENT — the ally selector and resume panel land here next
         ═══════════════════════════════════════════════════════════════════════ -->
    <main class="l-main" id="allies-main">
      <p class="allies-empty" id="allies-empty"></p>
    </main>

    <!-- Page selector popover (built by components/pageSelector.js) -->
    <div
      id="page-selector-popover"
      class="char-selector-popover page-selector-popover"
      role="group"
      aria-label="Selecionar página"
    ></div>

    <script type="module" src="/js/allies/main.js"></script>
  </body>
</html>
