<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archivum Sheet</title>
    <!-- Applies the resolved theme before first paint, to avoid a flash of
         the wrong theme. Mirrored in components/theme.js, which keeps it in sync
         afterward (button state, live OS-preference changes). -->
    <script>
      (function () {
        var stored = localStorage.getItem("archivum:theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="icon"
      type="image/png"
      href="/images/chrome-touch-icon-192x192.png"
    />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta
      name="msapplication-TileImage"
      content="/images/ms-touch-icon-144x144-precomposed.png"
    />
    <meta name="msapplication-TileColor" content="#ffffff" />
  </head>

  <body>
    <!-- ═══════════════════════════════════════════════════════════════════════
         MOBILE: Top bar
         All visible text here is set by initAppShell() from the localization file
         ═══════════════════════════════════════════════════════════════════════ -->
    <header class="l-topbar l-topbar--sheet" id="topbar">
      <div class="topbar-logo">
        <img src="/images/chrome-touch-icon-128x128.png" alt="Archivum Sheet" />
        <span class="topbar-logo-name" id="topbar-title">Archivum Sheet</span>
      </div>
      <div class="topbar-actions">
        <button
          id="view-mode-btn"
          class="topbar-btn"
          type="button"
          aria-label="Entrar no modo visualização"
          aria-pressed="false"
        >
          <span class="view-mode-btn-icon" aria-hidden="true">📃</span>
          <span class="view-mode-btn-label">Visualizar</span>
        </button>
        <button
          id="theme-toggle-btn"
          class="topbar-btn topbar-btn-icon-only"
          type="button"
          aria-label="Mudar para modo escuro"
          aria-pressed="false"
        >
          ☀️
        </button>
        <button
          id="page-selector-btn"
          class="topbar-btn page-selector-btn"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="Trocar de página"
        ></button>
        <button
          id="char-selector-btn"
          class="char-selector-btn"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span class="char-selector-btn-name">—</span>
          <span class="char-selector-btn-chevron" aria-hidden="true">⌄</span>
        </button>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════════════
         DESKTOP: Sidebar nav
         ═══════════════════════════════════════════════════════════════════════ -->
    <nav class="l-sidebar" id="sidebar" aria-label="Navegação"></nav>

    <!-- ═══════════════════════════════════════════════════════════════════════
         MAIN CONTENT
         ═══════════════════════════════════════════════════════════════════════ -->
    <main class="l-main" id="main-content">
      <!-- ───────────────────────────────────────────────────────────────────
           SECTION: PERSONAGEM — tabs: Personagem · Resumo
           ─────────────────────────────────────────────────────────────────── -->
      <section
        id="section-character"
        class="l-section"
        data-section="section-character"
      >
        <div class="box box--character">
          <!-- Tab strip -->
          <nav class="tab-strip" data-section="section-character">
            <button
              class="tab-btn"
              data-tab="tab-char-info"
              id="tab-btn-char-info"
            ></button>
            <button
              class="tab-btn"
              data-tab="tab-char-points"
              id="tab-btn-char-points"
            ></button>
            <button
              class="tab-btn"
              data-tab="tab-char-image"
              id="tab-btn-char-image"
            ></button>
            <button
              class="tab-strip-collapse"
              aria-expanded="false"
              aria-label="Expandir seção"
              type="button"
            >
              &#8250;
            </button>
          </nav>

          <!-- Panel: Personagem (info + race) -->
          <div class="tab-panel" id="tab-char-info">
            <div class="character-panel-grid">
              <!-- Left: Info -->
              <div class="character-info">
                <table class="character-info-table">
                  <tbody>
                    <tr>
                      <td>
                        <label
                          for="playerNameInput"
                          id="lbl-playerName"
                        ></label>
                      </td>
                      <td>
                        <input
                          id="playerNameInput"
                          type="text"
                          class="character-input"
                          data-field="player_name"
                        />
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <label
                          for="characterNameInput"
                          id="lbl-characterName"
                        ></label>
                      </td>
                      <td>
                        <input
                          id="characterNameInput"
                          type="text"
                          class="character-input"
                          data-field="character_name"
                        />
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <label for="characterSexSelect" id="lbl-sex"></label>
                      </td>
                      <td>
                        <select
                          id="characterSexSelect"
                          class="character-input"
                          data-field="character_sex"
                        >
                          <option value="" id="opt-sex-none"></option>
                          <option value="M" id="opt-sex-m"></option>
                          <option value="F" id="opt-sex-f"></option>
                        </select>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <label for="characterAgeInput" id="lbl-age"></label>
                      </td>
                      <td>
                        <input
                          id="characterAgeInput"
                          type="number"
                          min="0"
                          step="1"
                          class="character-input"
                          data-field="character_age"
                        />
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <label
                          for="characterWeightInput"
                          id="lbl-weight"
                        ></label>
                      </td>
                      <td>
                        <input
                          id="characterWeightInput"
                          type="number"
                          min="0"
                          step="0.1"
                          class="character-input"
                          data-field="character_weight"
                        />
                      </td>
                    </tr>
                    <tr class="ally-link-row" id="ally-link-row">
                      <td colspan="2" id="ally-link-control"></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Right: Race -->
              <div class="character-race">
                <div class="field-title" id="lbl-race-title"></div>
                <div class="race-selects">
                  <select id="raceNameSelect" style="display: none">
                    <option value="" id="opt-race-none"></option>
                  </select>
                  <select id="raceSubSelect" style="display: none">
                    <option value="" id="opt-subrace-none"></option>
                  </select>
                </div>
                <div
                  id="raceModifiers"
                  class="race-modifiers"
                  style="display: none"
                ></div>

                <!-- Meta-races (e.g. Undead) are ally/monster-only for now — see
                     docs/proposals/meta-race-templates.md's "Audience" decision. -->
                <div class="meta-race-row" id="meta-race-row">
                  <div class="field-title" id="lbl-metaRace-title"></div>
                  <div class="race-selects">
                    <select id="metaRaceNameSelect" style="display: none">
                      <option value="" id="opt-meta-race-none"></option>
                    </select>
                    <select id="metaRaceSubSelect" style="display: none">
                      <option value="" id="opt-meta-subrace-none"></option>
                    </select>
                  </div>
                  <div class="controls-row">
                    <button id="addMetaRaceBtn"></button>
                  </div>
                  <div id="metaRaceList"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Panel: Pontos do Personagem -->
          <div class="tab-panel" id="tab-char-points">
            <div class="character-points-xp-block">
              <div id="resume_bar_experience"></div>
            </div>

            <div class="character-panel-grid character-points-grid">
              <div class="character-points-block">
                <table class="character-info-table">
                  <tbody>
                    <tr>
                      <td>
                        <label
                          for="startingPointsInput"
                          id="lbl-startingPoints"
                        ></label>
                      </td>
                      <td>
                        <input
                          type="number"
                          id="startingPointsInput"
                          class="character-input"
                          data-field="starting_points"
                          min="0"
                          step="1"
                          placeholder="0"
                        />
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <label
                          for="experiencePointsInput"
                          id="lbl-experiencePoints"
                        ></label>
                      </td>
                      <td>
                        <input
                          type="number"
                          id="experiencePointsInput"
                          class="character-input"
                          data-field="experience_points"
                          min="0"
                          step="1"
                          placeholder="0"
                        />
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <label
                          for="abilityPointsInput"
                          id="lbl-abilityPoints"
                        ></label>
                      </td>
                      <td>
                        <input
                          type="number"
                          id="abilityPointsInput"
                          class="character-input"
                          data-field="ability_points"
                          min="0"
                          step="1"
                          placeholder="0"
                        />
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <label
                          for="magicPointsInput"
                          id="lbl-magicPoints"
                        ></label>
                      </td>
                      <td>
                        <input
                          type="number"
                          id="magicPointsInput"
                          class="character-input"
                          data-field="magic_points"
                          min="0"
                          step="1"
                          placeholder="0"
                        />
                      </td>
                    </tr>
                    <tr class="character-points-total-row">
                      <td>
                        <label id="lbl-totalAvailablePoints"></label>
                      </td>
                      <td>
                        <span id="totalAvailablePointsValue">0</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Points spent breakdown (moved from resume view) -->
              <table class="resume-table">
                <tbody>
                  <tr
                    class="resume-expander-row"
                    data-tbody-target="resume_points_tbody"
                  >
                    <td colspan="2">
                      <button class="resume-expander-btn" aria-expanded="false">
                        <span class="resume-expander-arrow">&#8250;</span>
                        <span id="sec-resume-points-detail"></span>
                      </button>
                    </td>
                  </tr>
                </tbody>

                <tbody
                  id="resume_points_tbody"
                  class="resume-collapsible"
                  hidden
                ></tbody>

                <tbody>
                  <tr class="resume-total-row">
                    <td><strong id="lbl-resume-totalPoints"></strong></td>
                    <td class="col-num" id="resume_total_points_cell">
                      <strong>0</strong>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Panel: Imagem do Personagem -->
          <div class="tab-panel" id="tab-char-image">
            <div class="charimg-editor">
              <!-- Left: circular preview (drag-to-reposition) -->
              <div class="charimg-preview-col">
                <div class="charimg-bg" id="charimg-bg">
                  <div class="charimg-preview" id="charimg-preview">
                    <!-- .charimg-img injected by JS when uploaded -->
                  </div>
                </div>
              </div>

              <!-- Right: controls stacked -->
              <div class="charimg-controls-col">
                <!-- Section label "Imagem" (mirrors reference left label) -->
                <p class="charimg-section-label" id="charimg-section-lbl"></p>

                <!-- Upload + Clear -->
                <div class="charimg-row">
                  <label
                    class="charimg-upload-btn"
                    for="charimg-file-input"
                    id="charimg-upload-lbl"
                  ></label>
                  <input
                    id="charimg-file-input"
                    type="file"
                    accept="image/jpeg,image/jpg,image/png,image/gif,image/webp"
                    style="display: none"
                  />
                  <button
                    class="charimg-clear-btn"
                    id="charimg-clear-btn"
                    type="button"
                  ></button>
                </div>

                <!-- Drag hint -->
                <p class="charimg-drag-hint" id="charimg-drag-hint"></p>

                <!-- Size & Position label -->
                <p class="charimg-group-label" id="charimg-size-pos-lbl"></p>

                <!-- Scale slider + presets on same row -->
                <div class="charimg-row charimg-row--scale">
                  <input
                    id="charimg-scale"
                    type="range"
                    min="10"
                    max="400"
                    step="1"
                    value="100"
                  />
                  <button
                    class="charimg-preset-btn"
                    data-size="cover"
                    id="charimg-preset-cover"
                  ></button>
                  <button
                    class="charimg-preset-btn"
                    data-size="contain"
                    id="charimg-preset-contain"
                  ></button>
                  <button
                    class="charimg-preset-btn"
                    data-pos="center"
                    id="charimg-pos-center"
                  ></button>
                  <button
                    class="charimg-preset-btn"
                    data-pos="top"
                    id="charimg-pos-top"
                  ></button>
                  <button
                    class="charimg-preset-btn"
                    data-pos="bottom"
                    id="charimg-pos-bottom"
                  ></button>
                  <button
                    class="charimg-preset-btn"
                    data-pos="left"
                    id="charimg-pos-left"
                  ></button>
                  <button
                    class="charimg-preset-btn"
                    data-pos="right"
                    id="charimg-pos-right"
                  ></button>
                </div>

                <!-- Background label -->
                <p class="charimg-group-label" id="charimg-bg-lbl"></p>

                <!-- Background radios -->
                <div class="charimg-row charimg-row--bg">
                  <button
                    class="charimg-radio-wrap"
                    data-bg="average"
                    id="charimg-bg-average"
                    type="button"
                  >
                    <span class="charimg-radio-btn" aria-hidden="true"></span>
                    <span
                      class="charimg-radio-label"
                      id="charimg-bg-average-lbl"
                    ></span>
                  </button>
                  <button
                    class="charimg-radio-wrap"
                    data-bg="black"
                    id="charimg-bg-black"
                    type="button"
                  >
                    <span class="charimg-radio-btn" aria-hidden="true"></span>
                    <span
                      class="charimg-radio-label"
                      id="charimg-bg-black-lbl"
                    ></span>
                  </button>
                  <button
                    class="charimg-radio-wrap"
                    data-bg="white"
                    id="charimg-bg-white"
                    type="button"
                  >
                    <span class="charimg-radio-btn" aria-hidden="true"></span>
                    <span
                      class="charimg-radio-label"
                      id="charimg-bg-white-lbl"
                    ></span>
                  </button>
                </div>
              </div>
              <!-- /.charimg-controls-col -->
            </div>
            <!-- /.charimg-editor -->
          </div>
        </div>
      </section>

      <!-- ───────────────────────────────────────────────────────────────────
           SECTION: ATRIBUTOS — tabs: Primários · Secundários · Dano Base
           ─────────────────────────────────────────────────────────────────── -->
      <section
        id="section-attributes"
        class="l-section"
        data-section="section-attributes"
      >
        <div class="box box--attr">
          <!-- Tab strip -->
          <nav class="tab-strip" data-section="section-attributes">
            <button
              class="tab-btn"
              data-tab="tab-attr-primary"
              id="tab-btn-attr-primary"
            ></button>
            <button
              class="tab-btn"
              data-tab="tab-attr-secondary"
              id="tab-btn-attr-secondary"
            ></button>
            <button
              class="tab-btn"
              data-tab="tab-attr-damage"
              id="tab-btn-attr-damage"
            ></button>
            <button
              class="tab-btn"
              data-tab="tab-attr-resistances"
              id="tab-btn-attr-resistances"
            ></button>
            <button
              class="tab-strip-collapse"
              aria-expanded="false"
              aria-label="Expandir seção"
              type="button"
            >
              &#8250;
            </button>
          </nav>

          <!-- Panel: Primários -->
          <div class="tab-panel" id="tab-attr-primary">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th id="th-attr-attribute"></th>
                    <th class="col-num" id="th-attr-base"></th>
                    <th class="col-num" id="th-attr-race"></th>
                    <th class="col-num" id="th-attr-modifier"></th>
                    <th class="col-num" id="th-attr-enchantment"></th>
                    <th class="col-num" id="th-attr-actual"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><strong>ST</strong></td>
                    <td class="col-num">
                      <div class="num-stepper">
                        <input
                          id="ST_base"
                          type="text"
                          inputmode="numeric"
                          data-min="5"
                          value="10"
                        />
                        <div class="stepper-btns">
                          <button
                            class="stepper-btn stepper-inc"
                            tabindex="-1"
                            aria-label="+"
                          >
                            +
                          </button>
                          <button
                            class="stepper-btn stepper-dec"
                            tabindex="-1"
                            aria-label="−"
                          >
                            −
                          </button>
                        </div>
                      </div>
                    </td>
                    <td class="col-num" id="ST_race">0</td>
                    <td class="col-num">
                      <div class="num-stepper">
                        <input
                          id="ST_mod"
                          type="text"
                          inputmode="numeric"
                          value="0"
                        />
                        <div class="stepper-btns">
                          <button
                            class="stepper-btn stepper-inc"
                            tabindex="-1"
                            aria-label="+"
                          >
                            +
                          </button>
                          <button
                            class="stepper-btn stepper-dec"
                            tabindex="-1"
                            aria-label="−"
                          >
                            −
                          </button>
                        </div>
                      </div>
                    </td>
                    <td
                      class="col-num enchantment-mod-cell"
                      id="ST_enchantment"
                    ></td>
                    <td class="col-num" id="ST_actual">10</td>
                  </tr>
                  <tr>
                    <td><strong>DX</strong></td>
                    <td class="col-num">
                      <div class="num-stepper">
                        <input
                          id="DX_base"
                          type="text"
                          inputmode="numeric"
                          data-min="5"
                          value="10"
                        />
                        <div class="stepper-btns">
                          <button
                            class="stepper-btn stepper-inc"
                            tabindex="-1"
                            aria-label="+"
                          >
                            +
                          </button>
                          <button
                            class="stepper-btn stepper-dec"
                            tabindex="-1"
                            aria-label="−"
                          >
                            −
                          </button>
                        </div>
                      </div>
                    </td>
                    <td class="col-num" id="DX_race">0</td>
                    <td class="col-num">
                      <div class="num-stepper">
                        <input
                          id="DX_mod"
                          type="text"
                          inputmode="numeric"
                          value="0"
                        />
                        <div class="stepper-btns">
                          <button
                            class="stepper-btn stepper-inc"
                            tabindex="-1"
                            aria-label="+"

                            +

                          <button
                            class="stepper-btn stepper-dec"
                            tabindex="-1"
                            aria-label="−"
                          >
                            −
                          </button>
                        </div>
                      </div>
                    </td>

                    ></td>

                  </tr>
                  <tr>
                    <td><strong>IQ</strong></td>
                    <td class="col-num">
                      <div class="num-stepper">
                        <input
                          id="IQ_base"
                          type="text"
                          inputmode="numeric"
                          data-min="5"
                          value="10"
                        />
                        <div class="stepper-btns">

                            class="stepper-btn stepper-inc"
                            tabindex="-1"
                            aria-label="+"
                          >
                            +
                          </button>
                          <button
                            class="stepper-btn stepper-dec"
                            tabindex="-1"
                            aria-label="−"
                          >
                            −
                          </button>
                        </div>

                    </td>

                    <td class="col-num">
                      <div class="num-stepper">
                        <input
                          id="IQ_mod"

                        />
                        <div class="stepper-btns">
                          <button

                            tabindex="-1"
                            aria-label="+"

                            +
                          </button>
                          <button

                            tabindex="-1"

                    </td>
                    <td
                      class="col-num enchantment-mod-cell"

                    ></td>
                    <td class="col-num" id="IQ_actual">10</td>
                  </tr>
                  <tr>
                    <td><strong>HT</strong></td>
                    <td class="col-num">
                      <div class="num-stepper">
                        <input
                          id="HT_base"
                          type="text"

                          data-min="5"
                          value="10"
                        />
                        <div class="stepper-btns">
                          <button
                            class="stepper-btn stepper-inc"
                            tabindex="-1"
                            aria-label="+"

                            +

                          <button
                            class="stepper-btn stepper-dec"

                      <div class="num-stepper">
                        <input
                          id="HT_mod"

                          inputmode="numeric"
                          value="0"
                        />
                        <div class="stepper-btns">
                          <button
                            class="stepper-btn stepper-inc"
                            tabindex="-1"
                            aria-label="+"
                          >
                            +
                          </button>
                          <button
                            class="stepper-btn stepper-dec"

                            aria-label="−"

                            −
                          </button>
                        </div>

                    <td class="col-num" id="HT_actual">10</td>

            </div>
          </div>

          <!-- Panel: Secundários -->
          <div class="tab-panel" id="tab-attr-secondary">
            <div class="table-wrapper">

                <thead>

                    <th class="col-num" id="th-sec-base"></th>
                    <th class="col-num" id="th-sec-bought"></th>

                    <th class="col-num" id="th-sec-enchantment"></th>
                    <th class="col-num" id="th-sec-final"></th>
                  </tr>
                </thead>
                <tbody id="secondaryTable"></tbody>
              </table>
            </div>
          </div>

          <!-- Panel: Dano Base -->

    <script type="module">
      // ── Hydrate all static text from the localization file ──────────────────
      // This is the only place static UI strings are set; everything reads from
      // LABELS so swapping the import in pt-BR/index.js (or creating en-US/) is enough.
      import { LABELS, t } from "/js/localization/pt-BR/index.js";
      import {
        populateStorageSelects,
        EQUIP_SECTION_PREFIXES,
      } from "/js/components/storageSelects.js";

      function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      function setAttr(id, attr, value) {
        const el = document.getElementById(id);
        if (el) el.setAttribute(attr, value);
      }

      function initAppShell() {
        const L = LABELS;

        // Top bar (the page selector hydrates itself — see components/pageSelector.js)
        setText("topbar-title", L.app.title);

        // Nav labels are now rendered by nav.js (initNav) from LABELS.nav

        // Tab button labels
        // section-character
        setText("tab-btn-char-info", L.tabs.character.info);
        setText("tab-btn-char-points", L.tabs.character.points);
        setText("tab-btn-char-image", L.tabs.character.image);
        // section-attributes
        setText("tab-btn-attr-primary", L.tabs.attributes.primary);
        setText("tab-btn-attr-secondary", L.tabs.attributes.secondary);
        setText("tab-btn-attr-damage", L.tabs.attributes.baseDamage);
        setText("tab-btn-attr-resistances", L.tabs.attributes.resistances);
        // section-traits
        setText("tab-btn-traits-advantages", L.tabs.traits.advantages);
        setText("tab-btn-traits-disadvantages", L.tabs.traits.disadvantages);
        // section-skills
        setText("tab-btn-skills-list", L.tabs.skills.skills);
        // section-magic
        setText("tab-btn-magic-spells", L.tabs.magic.spells);
        setText("tab-btn-magic-gear", L.tabs.magic.gear);
        // section-equipment
        setText("tab-btn-equip-armor", L.tabs.equipment.armor);
        setText("tab-btn-equip-shields", L.tabs.equipment.shields);
        setText("tab-btn-equip-melee", L.tabs.equipment.melee);
        setText("tab-btn-equip-ranged", L.tabs.equipment.ranged);
        setText("tab-btn-equip-firearms", L.tabs.equipment.firearms);
        setText("tab-btn-equip-ammo", L.tabs.equipment.ammo);
        // section-inventory
        setText("tab-btn-inv-alchemy", L.tabs.inventory.alchemy);
        setText("tab-btn-inv-survival", L.tabs.inventory.survivalGear);
        setText("tab-btn-inv-accessories", L.tabs.inventory.accessories);
        setText("tab-btn-inv-coin", L.tabs.inventory.coinPurse);
        setText("tab-btn-inv-custom", L.tabs.inventory.customInventory);

        // Sub-section summaries still in use (equip sub-details, output)
        EQUIP_SECTION_PREFIXES.forEach((prefix) => {
          setText(`sec-${prefix}-equipped`, L.sections.equipped);
          setText(`sec-${prefix}-stored`, L.sections.stored);
        });
        setText("sec-ammo-containers", L.ammo.containers);
        setText("sec-ammo-loose", L.ammo.looseAmmo);
        setText("sec-output", L.output.title);

        // Character info labels
        setText("lbl-playerName", L.character.playerName);
        setText("lbl-characterName", L.character.characterName);
        setText("lbl-sex", L.character.sex);
        setText("lbl-age", L.character.age);
        setText("lbl-weight", L.character.weight);
        setText("lbl-startingPoints", L.character.startingPoints);
        setText("lbl-experiencePoints", L.character.experiencePoints);
        setText("lbl-abilityPoints", L.character.abilityPoints);
        setText("lbl-magicPoints", L.character.magicPoints);
        setText("lbl-totalAvailablePoints", L.character.totalAvailablePoints);

      initAppShell();

      // ── Resume expander (collapsible detail rows) ─────────────────────────
      // Resolved locally within the same <table> so the handler works wherever
      // the resume panel currently lives (edit host or view-mode container).
      document.addEventListener("click", (e) => {
        const btn = e.target.closest(".resume-expander-btn");
        if (!btn) return;
        const table = btn.closest("table");
        if (!table) return;
        const tbody = table.querySelector("tbody.resume-collapsible");
        if (!tbody) return;
        const expanded = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", String(!expanded));
        tbody.hidden = expanded;
        btn
          .querySelector(".resume-expander-arrow")
          .classList.toggle("resume-expander-arrow--open", !expanded);
      });
